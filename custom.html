<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Order | JUFY BAKES</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <img src="Images/Simple Logo.png">
        </div>

        <div  class="he-lin">
           <nav>
                <ul>
                   <li><a href="index.html">Home</a></li>
                   <li><a href="about.html">About Us</a></li>
                   <li><a href="product.html">Product</a></li>
                   <li><a href="gallery.html">Gallery</a></li>
                   <li><a href="reviews.html">Reviews</a></li>
                   <li><a href="contact.html">Contact</a></li>
                </ul>
           </nav>
        </div>

         <a href="custom.html" class="btn">Order Now</a>

    </header>
    
<section class="custom-order">

    <h1>Custom Order Form</h1>
    <p>Tell us exactly what you'd like, and we'll create it just for you.</p>

    <form>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name" required>

        <label>Phone Number</label>
        <input type="tel" placeholder="08012345678" required>

        <label>Email Address (Optional)</label>
        <input type="email" placeholder="example@email.com">

        <label>Product Category</label>
        <select required>
            <option value="">Select Product</option>
            <option>Cake</option>
            <option>Pastries</option>
            <option>Chinchin</option>
        </select>

        <label>Occasion</label>
        <select>
            <option>Birthday</option>
            <option>Wedding</option>
            <option>Bridal Shower</option>
            <option>Baby Shower</option>
            <option>Graduation</option>
            <option>Anniversary</option>
            <option>Corporate Event</option>
            <option>Just Because</option>
            <option>Other</option>
        </select>

        <label>Preferred Flavour</label>
        <select>
            <option>Vanilla</option>
            <option>Chocolate</option>
            <option>Red Velvet</option>
            <option>Strawberry</option>
            <option>Fruit</option>
            <option>Mixed Flavours</option>
            <option>Other</option>
        </select>

        <label>Size</label>
        <select>
            <option>Small</option>
            <option>Medium</option>
            <option>Large</option>
            <option>Extra Large</option>
        </select>

        <label>Quantity</label>
        <input type="number" min="1" placeholder="Enter quantity">

        <label>Colour Theme</label>
        <input type="text" placeholder="White & Gold">

        <label>Preferred Delivery Date</label>
        <input type="date">

        <label>Delivery Method</label>
        <select>
            <option>Pickup</option>
            <option>Delivery</option>
        </select>

        <label>Delivery Address</label>
        <textarea rows="3" placeholder="Enter delivery address"></textarea>

        <label>Special Instructions</label>
        <textarea rows="5" placeholder="Describe your design, message on the cake, decorations, pastry filling, chinchin flavour, packaging, etc."></textarea>

        <button type="submit">Submit Order</button>

    </form>

</section>
</body>
</html>
